<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主页面</title>
    <link rel="stylesheet" href="home.css">
    <script src="home.js"></script>
    <style>
        body{
            font-family: "哥特黑白无常", sans-serif;
        }
        
        /* 默认样式 (PC端) */
        #music {
            width: 100px;
            height: 100px;
            border-radius: 50%; /* 修正为标准的圆形 */
            position: absolute;
            top: -26%;
            left: 64%;
            padding: 0; /* 移除内边距，方便图片居中 */
            display: flex; /* 使用 Flexbox 居中图片 */
            justify-content: center;
            align-items: center;
        }
        #music img {
            width: 70px;
            height: 70px;
            margin: 0; /* 移除 margin-top，由 Flexbox 控制 */
        }

        /* 移动端适配 */
        @media screen and (max-width: 1000px) {
            #title {
                margin-top: 50px; /* 给标题一些顶部空间 */
            }
            
            #music {
                /* 移动端改为固定在屏幕右上角或右下角，避免干扰中间的按钮和标题 */
                position: fixed; 
                top: 20px;
                right: 20px;
                left: auto; /* 清除默认的 left */
                
                /* 调整大小适应移动端 */
                width: 60px;
                height: 60px;
            }
            
            #music img {
                width: 40px;
                height: 40px;
            }
            
            .buttons {
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- <audio>元素已存在 -->
    <audio id="myAudio" src="./family_tune.mp3" loop></audio> <!-- 建议添加 loop 属性让音乐循环播放 -->
    <div id="bg">
    <div id="title">
        <h1 align="center">Rusting</h1>
    </div>
    <br>
    <div class="buttons">
        <button type="button" onclick="toStart()">开始游戏</button>
        <br>
        <button type="button" onclick="toContinue()">继续游戏</button>
        <br>         
        <button type="button" onclick="window.location.href='../save/load.html'">读取存档</button>
        <br>
        <button type="button" onclick="window.location.href='./setting.html'">设置</button>
        <br>
        <button type="button" onclick="window.location.href='../group/group.html'">制作组</button>
        <br>
        <!-- 将音乐按钮放在 buttons 容器内可能导致定位基准问题，
             原代码是 absolute 定位，相对于最近的 relative 父级（.buttons）。
             这里保持 HTML 结构不变，通过 CSS 修改定位策略。 -->
        <button type="button" onclick="togglePlay()" id="music"><img src="./picture_home/music.png" alt="音乐开关"></button>
    </div>
</div>
</body>

</html>

<script>
    var myAudio = document.getElementById("myAudio");
    
    // 1. 读取音量设置并应用
    var storedVolume = localStorage.getItem('volume');
    // 将存储的 0-100 值转换为 <audio> 元素所需的 0.0 - 1.0 值
    if (storedVolume !== null) {
        // 如果存储了值，则使用它
        myAudio.volume = parseFloat(storedVolume) / 100;
    } else {
        // 如果没有存储值（第一次访问），使用默认值，例如设置页面中的默认值 50
        myAudio.volume = 50 / 100; // 0.5
    }

    // 2. 尝试自动播放音乐
    // 注意: 现代浏览器通常会阻止没有用户交互的自动播放，
    // 但我们会尝试播放，如果失败（如控制台所示），则需要用户手动点击。
    // 为了满足"没有音乐，要手动点击音乐开关才有声音"的反馈，我们把自动播放放在这里。
    window.onload = function() {
        // 尝试播放。如果浏览器阻止，它会返回一个 Promise 并在 catch 中处理。
        myAudio.play().catch(error => {
            console.log("自动播放被浏览器阻止:", error.name);
            // 这里可以添加逻辑来提示用户手动点击播放按钮
        });
    };

    function togglePlay() {
      return myAudio.paused ? myAudio.play() : myAudio.pause();
    }
  </script>
