<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>存档</title>
    <link rel="stylesheet" href="../homepage/home.css">
    <script src="save.js"></script>
    <style>
        @media screen and (max-width: 1000px) {
            body{
                width: 100%;
                height: 300%;
            }
            .buttons{
                flex-direction: column;
                flex-wrap: wrap;
                transform: translate(0,500px);
            }
            .setback{
                bottom:0;
                transform: translate(0,1100px);
            }
        }
        body {
            background-image: url(../homepage/picture_home/desk.jpg);
            background-size: cover;
            display: flex; 
            justify-content: center;
            align-items: center; 
            height: 100vh;
            margin: 0; 
        }
        .buttons {
            display: flex;
            justify-content: space-around;
        }
        .buttons button {
            margin: 0 20px;
            height: 600px;width: 400px;
            font-size: 57px;
            /* 确保内部span换行显示 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .setback {
            position: absolute;
            bottom:10px;
        }
        .buttons img {
            height:200px;
            width:300px;
            margin-top:50px;
            margin-bottom: 20px;
        }
        /* 修改选择器以匹配新的 span 结构 */
        .buttons .save-text {
            font-size:16px;
            display: block;
            margin-bottom: 10px;
        }
        .buttons .save-title {
            font-size: 1.17em;
            font-weight: bold;
            margin-bottom: -10px;
            display: block;
        }
    </style>
</head>

<body>
    <div class="buttons">
        <button onclick="saveGame1()" >
            <!-- 使用透明像素占位，防止空src请求 -->
            <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="save1" id="save1img">
            <!-- 替换 p 和 h3 为 span，并修复原代码中未闭合的 h3 -->
            <span id="save1text" class="save-text">save1</span>
            <span class="save-title">save1</span>
        </button>
        <br>
        <button onclick="saveGame2()">
            <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="save2" id="save2img">
            <span id="save2text" class="save-text">save1</span>
            <span class="save-title">save2</span>
        </button>
        <br>
        <button onclick="saveGame3()">
            <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="save3" id="save3img">
            <span id="save3text" class="save-text">save1</span>
            <span class="save-title">save3</span>
        </button>
    </div>
    <div class ="setback">
        <button onclick="BackToGame()">返回游戏</button>
    </div>
</body>
</html>
