<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Rusting</title>
    <style>
        /* CSS样式保持不变 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
        }

        body {
            background-color: #1a2028;
            background-image: 
                linear-gradient(30deg, rgba(40, 50, 60, 0.3) 12%, transparent 12.5%, transparent 87%, rgba(40, 50, 60, 0.3) 87.5%, rgba(40, 50, 60, 0.3)),
                linear-gradient(150deg, rgba(40, 50, 60, 0.3) 12%, transparent 12.5%, transparent 87%, rgba(40, 50, 60, 0.3) 87.5%, rgba(40, 50, 60, 0.3)),
                linear-gradient(30deg, rgba(40, 50, 60, 0.3) 12%, transparent 12.5%, transparent 87%, rgba(40, 50, 60, 0.3) 87.5%, rgba(40, 50, 60, 0.3)),
                linear-gradient(150deg, rgba(40, 50, 60, 0.3) 12%, transparent 12.5%, transparent 87%, rgba(40, 50, 60, 0.3) 87.5%, rgba(40, 50, 60, 0.3)),
                linear-gradient(60deg, rgba(60, 70, 80, 0.15) 25%, transparent 25.5%, transparent 75%, rgba(60, 70, 80, 0.15) 75%, rgba(60, 70, 80, 0.15)),
                linear-gradient(60deg, rgba(60, 70, 80, 0.15) 25%, transparent 25.5%, transparent 75%, rgba(60, 70, 80, 0.15) 75%, rgba(60, 70, 80, 0.15));
            background-size: 80px 140px;
            background-position: 0 0, 0 0, 40px 70px, 40px 70px, 0 0, 40px 70px;
            color: #c8d0d8;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 老旧工业元素装饰 */
        .factory-decoration {
            position: absolute;
            z-index: -1;
            opacity: 0.15;
        }

        .rust-pipe {
            position: absolute;
            background: linear-gradient(90deg, #5d4c3c, #8b7355, #5d4c3c);
            border-radius: 8px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
        }

        .rust-pipe-1 {
            width: 300px;
            height: 25px;
            top: 10%;
            right: 8%;
            transform: rotate(20deg);
            opacity: 0.4;
        }

        .rust-pipe-2 {
            width: 220px;
            height: 20px;
            bottom: 15%;
            left: 8%;
            transform: rotate(-15deg);
            opacity: 0.4;
        }

        .old-gear {
            position: absolute;
            width: 70px;
            height: 70px;
            background-color: #3a3a3a;
            border-radius: 50%;
            border: 8px solid #5d4c3c;
            opacity: 0.2;
            animation: slow-rotate 40s linear infinite;
        }

        .old-gear:before, .old-gear:after {
            content: '';
            position: absolute;
            background-color: #5d4c3c;
        }

        .old-gear:before {
            width: 100%;
            height: 20px;
            top: 25px;
            left: 0;
        }

        .old-gear:after {
            width: 20px;
            height: 100%;
            top: 0;
            left: 25px;
        }

        @keyframes slow-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .old-gear-1 {
            top: 18%;
            left: 5%;
            animation-duration: 50s;
        }

        .old-gear-2 {
            bottom: 20%;
            right: 10%;
            animation-duration: 45s;
            animation-direction: reverse;
        }

        .rust-stain {
            position: absolute;
            width: 120px;
            height: 80px;
            background: radial-gradient(ellipse at center, rgba(139, 69, 19, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            opacity: 0.3;
        }

        .rust-stain-1 {
            top: 30%;
            left: 15%;
        }

        .rust-stain-2 {
            bottom: 25%;
            right: 20%;
        }

        .container {
            max-width: 900px;
            min-height: calc(100vh - 40px);
            margin: 0 auto;
            background-color: rgba(40, 45, 50, 0.92);
            border: 8px solid #5d4c3c;
            border-radius: 4px;
            box-shadow: 
                0 0 40px rgba(0, 0, 0, 0.7),
                inset 0 0 60px rgba(0, 0, 0, 0.9);
            padding: 25px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .container:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(100, 80, 60, 0.05) 2px,
                rgba(100, 80, 60, 0.05) 4px
            );
            pointer-events: none;
            z-index: -1;
        }

        .title {
            text-align: center;
            font-size: 48px;
            color: #d4c4a8;
            text-shadow: 
                3px 3px 0 #3a3025,
                6px 6px 0 #1a1a1a;
            margin: 10px 0 30px;
            padding-bottom: 15px;
            border-bottom: 3px solid #8b7355;
            letter-spacing: 3px;
            font-weight: bold;
            position: relative;
            font-family: 'SimHei', 'Microsoft YaHei', sans-serif;
        }

        .title:after {
            content: "工业控制室";
            position: absolute;
            font-size: 16px;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            color: #a08c6c;
            font-weight: normal;
            text-shadow: 1px 1px 2px #000;
            letter-spacing: 2px;
            font-style: italic;
        }

        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            flex: 1;
            justify-content: center;
        }

        .chess-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: rgba(30, 35, 40, 0.8);
            border-radius: 6px;
            border: 4px solid #5d4c3c;
            box-shadow: 
                inset 0 0 30px rgba(0, 0, 0, 0.8),
                0 0 20px rgba(0, 0, 0, 0.6);
        }

        .chess {
            display: block;
            box-shadow: 
                0 0 0 10px #5d4c3c,
                0 0 0 12px #3a3025,
                15px 15px 25px rgba(0, 0, 0, 0.7);
            cursor: pointer;
            background-color: #a08c6c;
            border-radius: 2px;
            border: 1px solid #5d4c3c;
        }

        .btn-skip {
            padding: 18px 50px;
            background: linear-gradient(to bottom, #8b7355, #5d4c3c);
            color: #e8e0d0;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s;
            box-shadow: 
                0 6px 0 #3a3025,
                0 8px 15px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            margin-top: 20px;
            font-family: 'SimHei', 'Microsoft YaHei', sans-serif;
        }

        .btn-skip:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 8px 0 #3a3025,
                0 12px 20px rgba(0, 0, 0, 0.6);
            background: linear-gradient(to bottom, #9c8464, #6d5c4c);
        }

        .btn-skip:active {
            transform: translateY(2px);
            box-shadow: 
                0 4px 0 #3a3025,
                0 6px 10px rgba(0, 0, 0, 0.5);
        }

        .btn-skip:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .btn-skip:hover:before {
            left: 100%;
        }

        .status {
            font-size: 26px;
            text-align: center;
            padding: 20px;
            background: linear-gradient(to right, rgba(50, 45, 40, 0.9), rgba(60, 55, 50, 0.9));
            border-radius: 6px;
            border: 4px solid #8b7355;
            margin-bottom: 30px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f0e6d2;
            text-shadow: 2px 2px 3px #000;
            font-weight: bold;
            box-shadow: 
                inset 0 0 25px rgba(0, 0, 0, 0.7),
                0 0 15px rgba(0, 0, 0, 0.5);
            font-family: 'SimHei', 'Microsoft YaHei', sans-serif;
        }

        .factory-stamp {
            position: absolute;
            bottom: 15px;
            right: 20px;
            color: #8b7355;
            font-size: 14px;
            opacity: 0.7;
            transform: rotate(-3deg);
            font-family: monospace;
            letter-spacing: 1px;
            border: 1px solid #8b7355;
            padding: 4px 8px;
            background: rgba(0, 0, 0, 0.3);
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
                min-height: auto;
            }
            
            .title {
                font-size: 36px;
                margin-bottom: 20px;
            }
            
            .game-area {
                gap: 20px;
            }
            
            .chess {
                width: 350px;
                height: 350px;
            }
            
            .btn-skip {
                font-size: 20px;
                padding: 16px 40px;
            }
            
            .status {
                font-size: 22px;
                padding: 15px;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .title {
                font-size: 28px;
            }
            
            .chess {
                width: 300px;
                height: 300px;
            }
            
            .btn-skip {
                font-size: 18px;
                padding: 14px 30px;
            }
        }
        
        /* 确保棋盘适应容器 */
        canvas.chess {
            display: block;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <!-- 老旧工业装饰元素 -->
    <div class="rust-pipe rust-pipe-1"></div>
    <div class="rust-pipe rust-pipe-2"></div>
    <div class="old-gear old-gear-1"></div>
    <div class="old-gear old-gear-2"></div>
    <div class="rust-stain rust-stain-1"></div>
    <div class="rust-stain rust-stain-2"></div>
    
    <div class="container">
        <h1 class="title">五子棋</h1>
        
        <div class="status" id="gameStatus">-- 轮到您下棋 (黑子) --</div>
        
        <div class="game-area">
            <div class="chess-container">
                <canvas class="chess" width="450" height="450"></canvas>
            </div>
            
            <button type="button" class="btn-skip" onclick="skip()">跳过游戏</button>
        </div>
        
        <div class="factory-stamp">第023号控制室</div>
    </div>

    <!-- 引用外部JS文件 -->
    <script src="wuziqi.js"></script>
</body>
</html>
